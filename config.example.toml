# Copy to config.toml and fill in. config.toml is not committed (it holds your secret token).

# Public address of the feed folder, including the secret token path.
# Example: https://myhost.tail1234.ts.net:8443/<token>
base_url = "https://HOSTNAME:8443/TOKEN"   # filled in by deploy/setup-config.sh

# Where feed XML + audio are written (this folder is what Funnel serves).
public_dir = "/srv/yt-podcast/public"
# Where download bookkeeping lives (not served).
state_dir = "/srv/yt-podcast/state"

yt_dlp = "/opt/yt-podcast/venv/bin/yt-dlp"
max_downloads_per_run = 30       # caps one run; the first run fetches the whole back catalog
sleep_between_downloads = 20     # seconds, be gentle with YouTube

[[feeds]]
slug = "dungeon-masters"
title = "Dungeon Masters (D&D Actual Play)"
author = "Wizards of the Coast"
description = "Dungeon Masters, the official Dungeons & Dragons actual play series. Audio from YouTube."
link = "https://www.youtube.com/playlist?list=PLYjIYvLQCIkI"
# Any video of the channel; used to look up playlists by their title.
channel_video = "https://youtu.be/6mOe2-NHvq4"
# cover = "https://.../cover.jpg"   # optional; defaults to the first episode's thumbnail
sponsorblock_remove = ["sponsor", "selfpromo", "interaction"]

# Videos whose title matches any of these are skipped (trailers, watch parties, ...).
# FULL CAMPAIGN = whole-campaign compilations.
exclude = ["Watch Party", "Trailer", "Opening Titles", "Recap", "Behind the Scenes", "FULL CAMPAIGN", "FULL \\d+ HOUR"]

# Removed from episode titles in the app.
title_cleanup = [
  '\|?\s*Official D&D Actual Play Series',
  '\|?\s*D&D Official.*$',
  '\|?\s*Tabletop Role Play',
  '\|\s*Dungeons & Dragons\s*$',
  '\|\s*D&D\s*$',
  '^Dungeon Masters:?\s*\|?\s*',
  '^World of Warcraft (D&D )?Campaign\s*\|?\s*',
  '\|\s*Dungeon Masters\s*$',
  '^D&D:\s*',
]

# Picks the episode number out of the title; falls back to playlist order.
episode_regex = '(?:Episodes?|Ep\.?)\s*(\d+)'

[feeds.season_names]
1 = "Campaign 1: Ashes of the Black Rose"
2 = "Innsmouth Interlude"
3 = "Campaign 2: Arcana Unleashed"
4 = "World of Warcraft"

# One playlist per campaign, looked up on the channel by title. Each is one season.
[[feeds.playlists]]
title = "Dungeon Masters: Ravenloft D&D Campaign"
season = 1

[[feeds.playlists]]
title = "Dungeon Masters: Innsmouth Interlude D&D Campaign"
season = 2
# This one-shot only exists as one full upload, so don't apply the "FULL CAMPAIGN" skip here.
ignore_feed_exclude = true

[[feeds.playlists]]
title = "Dungeon Masters: Arcana Unleashed D&D Campaign"
season = 3

# "D&D Dungeon Masters | World Of Warcraft Campaign" (newest first).
[[feeds.playlists]]
url = "https://www.youtube.com/playlist?list=PLYjIYvLQCIkI"
season = 4
reverse = true
# This playlist has both the premiere stream and the regular upload of "Episodes 1 & 2".
exclude = ["PREMIERE"]
